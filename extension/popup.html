<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhishGuard AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 340px;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    background: #0f0f0f;
    color: #e0e0e0;
  }
  header {
    padding: 12px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 15px; font-weight: 600; color: #fff; flex: 1; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  #dot.ok  { background: #1D9E75; }
  #dot.err { background: #E24B4A; }
  #agent-status { font-size: 11px; color: #666; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #1e1e1e;
  }
  .toggle-label { font-size: 13px; color: #ccc; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { display: none; }
  .slider {
    position: absolute; inset: 0;
    background: #333; border-radius: 24px;
    cursor: pointer; transition: .25s;
  }
  .slider:before {
    content: ""; position: absolute;
    width: 18px; height: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .25s;
  }
  input:checked + .slider { background: #1D9E75; }
  input:checked + .slider:before { transform: translateX(20px); }

  .section-title {
    padding: 10px 16px 4px;
    font-size: 11px; color: #555;
    text-transform: uppercase; letter-spacing: .5px;
  }

  #log-list { max-height: 270px; overflow-y: auto; padding: 4px 8px 8px; }
  .log-item {
    background: #1a1a1a; border: 1px solid #242424;
    border-radius: 6px; padding: 7px 10px; margin-bottom: 5px;
  }
  .log-url {
    font-size: 11px; color: #aaa;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 295px;
  }
  .log-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 600; }
  .badge.threat  { background: #3d1010; color: #ff6b6b; }
  .badge.safe    { background: #0d2e1e; color: #4dbb8a; }
  .log-score { font-size: 11px; color: #666; }
  .log-type  { font-size: 10px; color: #888; }
  .log-time  { font-size: 10px; color: #444; margin-left: auto; }
  #empty { text-align: center; color: #444; padding: 24px 0; font-size: 12px; }

  .stats {
    display: flex; border-top: 1px solid #1e1e1e;
    padding: 10px 16px; gap: 20px;
  }
  .stat { text-align: center; }
  .stat .n { font-size: 20px; font-weight: 700; color: #fff; }
  .stat .l { font-size: 10px; color: #555; }
  .stat.red .n  { color: #ff6b6b; }
  .stat.grn .n  { color: #4dbb8a; }

  #clear {
    width: calc(100% - 32px); margin: 0 16px 12px;
    padding: 6px; background: #1e1e1e;
    border: 1px solid #2a2a2a; border-radius: 6px;
    color: #777; cursor: pointer; font-size: 12px;
  }
  #clear:hover { background: #282828; color: #aaa; }
</style>
</head>
<body>

<header>
  <div id="dot"></div>
  <h1>🛡️ PhishGuard AI</h1>
  <span id="agent-status">checking...</span>
</header>

<div class="toggle-row">
  <span class="toggle-label">Protection active</span>
  <label class="switch">
    <input type="checkbox" id="toggle" checked>
    <span class="slider"></span>
  </label>
</div>

<div class="section-title">Recent scans</div>
<div id="log-list"><div id="empty">No scans yet — browse any site</div></div>

<div class="stats">
  <div class="stat red"><div class="n" id="s-block">0</div><div class="l">Blocked</div></div>
  <div class="stat grn"><div class="n" id="s-safe">0</div><div class="l">Safe</div></div>
  <div class="stat"><div class="n" id="s-total">0</div><div class="l">Total</div></div>
</div>

<button id="clear">Clear history</button>

<script>
const AGENT = "http://127.0.0.1:5000";

async function checkHealth() {
  const dot = document.getElementById("dot");
  const txt = document.getElementById("agent-status");
  try {
    const r = await fetch(`${AGENT}/health`, { signal: AbortSignal.timeout(2000) });
    const d = await r.json();
    dot.className = "ok";
    txt.textContent = d.models_loaded ? "Agent ready" : "Loading models...";
  } catch {
    dot.className = "err";
    txt.textContent = "Agent offline — start agent_server.py";
  }
}

async function loadLog() {
  const { pglog = [] } = await chrome.storage.local.get("pglog");
  const list  = document.getElementById("log-list");

  if (!pglog.length) {
    list.innerHTML = '<div id="empty">No scans yet — browse any site</div>';
    return;
  }

  list.innerHTML = pglog.slice(0, 40).map(e => {
    const v   = e.verdict || {};
    const pct = Math.round((v.combined_score || 0) * 100);
    const cls = v.is_threat ? "threat" : "safe";
    const lbl = v.is_threat ? "BLOCKED" : "SAFE";
    const ago = timeAgo(e.timestamp);
    const typ = v.threat_type || "";
    return `<div class="log-item">
      <div class="log-url" title="${e.url}">${e.url}</div>
      <div class="log-meta">
        <span class="badge ${cls}">${lbl}</span>
        <span class="log-score">${pct}%</span>
        ${typ && typ !== "SAFE" ? `<span class="log-type">${typ}</span>` : ""}
        <span class="log-time">${ago}</span>
      </div>
    </div>`;
  }).join("");

  const blocked = pglog.filter(e => e.verdict?.is_threat).length;
  document.getElementById("s-block").textContent = blocked;
  document.getElementById("s-safe").textContent  = pglog.length - blocked;
  document.getElementById("s-total").textContent = pglog.length;
}

const tog = document.getElementById("toggle");
chrome.storage.local.get("enabled", d => { tog.checked = d.enabled !== false; });
tog.addEventListener("change", () => {
  chrome.runtime.sendMessage({ type: "SET_ENABLED", value: tog.checked });
});

document.getElementById("clear").addEventListener("click", async () => {
  await chrome.storage.local.set({ pglog: [] });
  loadLog();
});

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60)   return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

checkHealth();
loadLog();
</script>
</body>
</html>
